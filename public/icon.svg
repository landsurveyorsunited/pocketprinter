<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EEF2F6"/>
      <stop offset="100%" stop-color="#DCE3EC"/>
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#243B53"/>
      <stop offset="100%" stop-color="#102A43"/>
    </linearGradient>
    <linearGradient id="tealAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#087F8C"/>
      <stop offset="100%" stop-color="#055B64"/>
    </linearGradient>
    <filter id="neuShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="8" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.18"/>
      <feDropShadow dx="-6" dy="-6" stdDeviation="8" flood-color="#FFFFFF" flood-opacity="0.8"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Tactile Book Outer Shell -->
  <g filter="url(#neuShadow)">
    <rect x="96" y="86" width="320" height="340" rx="36" fill="url(#bookCover)"/>
    <rect x="96" y="86" width="46" height="340" rx="12" fill="#0E2235"/>
    
    <!-- Paper Page Stack Preview on Right -->
    <rect x="376" y="106" width="30" height="300" rx="6" fill="#F8FAFC" opacity="0.95"/>
    <line x1="384" y1="120" x2="384" y2="392" stroke="#CBD5E1" stroke-width="2"/>
    <line x1="392" y1="120" x2="392" y2="392" stroke="#CBD5E1" stroke-width="2"/>

    <!-- Bookmark Ribbon -->
    <path d="M 290 86 L 290 220 L 310 200 L 330 220 L 330 86 Z" fill="url(#tealAccent)"/>

    <!-- Tactile Directory Emblem: Rolodex / Address Card -->
    <rect x="176" y="170" width="160" height="172" rx="20" fill="#EEF2F6" stroke="#FFFFFF" stroke-width="2"/>
    
    <!-- Contact Card Silhouette -->
    <circle cx="256" cy="225" r="22" fill="#243B53"/>
    <path d="M 230 274 C 230 254, 282 254, 282 274 Z" fill="#243B53"/>
    <rect x="210" y="292" width="92" height="8" rx="4" fill="#087F8C"/>
    <rect x="226" y="308" width="60" height="6" rx="3" fill="#94A3B8"/>
  </g>
</svg>
